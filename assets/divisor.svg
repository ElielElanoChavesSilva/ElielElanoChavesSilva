    <circle cx="-8" cy="0" r="5" fill="#D4AF37"/>
    <polygon points="110,0 40,-3 40,3" fill="#B8C2CC"/>
    <rect x="34" y="-9" width="6" height="18" rx="2" fill="#D4AF37"/>
    <rect x="12" y="-3" width="22" height="6" fill="#6b4a1e"/>
    <circle cx="8" cy="0" r="5" fill="#D4AF37"/>
    <path d="M0 -14 L10 -9 V2 Q10 10 0 15 Q-10 10 -10 2 V-9 Z" fill="#8B0000" stroke="#D4AF37" stroke-width="2">
