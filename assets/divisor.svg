<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40" role="img" aria-label="Divisor com espada">
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gleam">
      <stop offset="0" stop-color="#FFF6CC"/>
      <stop offset="1" stop-color="#FFF6CC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="40" y="19" width="1120" height="2" fill="url(#line)"/>
  <circle cx="0" cy="20" r="10" fill="url(#gleam)">
    <animate attributeName="cx" values="80;1120;1120" keyTimes="0;0.7;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1;0.6;0.7;1" dur="4s" repeatCount="indefinite"/>
