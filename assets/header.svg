<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Eliel Elano Chaves Silva — Cavaleiro do Backend">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05040a"/>
      <stop offset="0.55" stop-color="#1c1018"/>
      <stop offset="1" stop-color="#4a1a08"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="-500" y1="0" x2="300" y2="0">
      <stop offset="0" stop-color="#B8912A"/>
      <stop offset="0.42" stop-color="#D4AF37"/>
      <stop offset="0.5" stop-color="#FFF6CC"/>
      <stop offset="0.58" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#B8912A"/>
      <animate attributeName="x1" values="-500;1100;1100" keyTimes="0;0.6;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="300;1900;1900" keyTimes="0;0.6;1" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="torchGlow">
      <stop offset="0" stop-color="#FFB347" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF6A00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#F5E6C8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F5E6C8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#sky)"/>

    <g fill="#F5E6C8">
      <circle cx="60" cy="40" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="90" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="30" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="310" cy="70" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="390" cy="25" r="1.4"><animate attributeName="opacity" values="1;0.4;1" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="55" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="20" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="650" cy="45" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="28" r="1.7"><animate attributeName="opacity" values="1;0.3;1" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="80" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="35" r="1.4"><animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="130" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="1160" cy="40" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="30" cy="150" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.8s" repeatCount="indefinite"/></circle>
    </g>

    <circle cx="1000" cy="205" r="70" fill="url(#moonGlow)"/>
    <mask id="crescent"><rect width="1200" height="340" fill="#fff"/><circle cx="1014" cy="197" r="26" fill="#000"/></mask><circle cx="1000" cy="205" r="30" fill="#F5E6C8" mask="url(#crescent)"/>

    <path d="M0 340 L0 298 Q150 268 300 292 T600 288 T900 294 T1200 282 L1200 340 Z" fill="#0b0709"/>

    <g fill="#0b0709">
      <rect x="480" y="272" width="240" height="68"/>
      <rect x="480" y="262" width="16" height="12"/><rect x="510" y="262" width="16" height="12"/>
      <rect x="540" y="262" width="16" height="12"/><rect x="644" y="262" width="16" height="12"/>
      <rect x="674" y="262" width="16" height="12"/><rect x="704" y="262" width="16" height="12"/>
      <rect x="450" y="238" width="54" height="102"/>
      <polygon points="444,240 477,198 510,240"/>
      <rect x="696" y="238" width="54" height="102"/>
      <polygon points="690,240 723,198 756,240"/>
      <rect x="562" y="222" width="76" height="118"/>
      <polygon points="556,224 600,180 644,224"/>
      <line x1="600" y1="182" x2="600" y2="160" stroke="#0b0709" stroke-width="3"/>
    </g>
    <g transform="translate(601 160)">
      <path d="M0 0 H22 L16 6 L22 12 H0 Z" fill="#8B0000">
        <animateTransform attributeName="transform" type="skewY" values="0;6;0;-6;0" dur="2.5s" repeatCount="indefinite"/>
      </path>
    </g>
    <path d="M582 340 V306 A18 18 0 0 1 618 306 V340 Z" fill="#2a1a10"/>
    <g fill="#F4B942">
      <rect x="470" y="262" width="8" height="14" rx="4"><animate attributeName="opacity" values="1;0.5;1;0.8;1" dur="2s" repeatCount="indefinite"/></rect>
      <rect x="716" y="262" width="8" height="14" rx="4"><animate attributeName="opacity" values="0.7;1;0.6;1;0.7" dur="2.6s" repeatCount="indefinite"/></rect>
      <rect x="590" y="240" width="8" height="14" rx="4"><animate attributeName="opacity" values="1;0.6;1" dur="1.8s" repeatCount="indefinite"/></rect>
      <rect x="604" y="240" width="8" height="14" rx="4"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/></rect>
    </g>

    <g transform="translate(60 0)">
      <rect x="-3" y="0" width="6" height="210" fill="#3b2a1a"/>
      <circle cx="0" cy="6" r="7" fill="#D4AF37"/>
      <g transform="translate(3 30)">
        <path d="M0 0 H70 V120 L35 98 L0 120 Z" fill="#8B0000" stroke="#D4AF37" stroke-width="3">
          <animateTransform attributeName="transform" type="skewY" values="0;3;0;-3;0" dur="4s" repeatCount="indefinite"/>
        </path>
        <text x="35" y="66" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#D4AF37">C#</text>
      </g>
    </g>
    <g transform="translate(1140 0)">
      <rect x="-3" y="0" width="6" height="210" fill="#3b2a1a"/>
      <circle cx="0" cy="6" r="7" fill="#D4AF37"/>
      <g transform="translate(-73 30)">
        <path d="M0 0 H70 V120 L35 98 L0 120 Z" fill="#8B0000" stroke="#D4AF37" stroke-width="3">
          <animateTransform attributeName="transform" type="skewY" values="0;-3;0;3;0" dur="4s" repeatCount="indefinite"/>
        </path>
        <text x="35" y="66" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#D4AF37">.NET</text>
      </g>
    </g>

    <g transform="translate(380 250)">
      <circle cx="0" cy="-30" r="60" fill="url(#torchGlow)">
        <animate attributeName="r" values="55;65;58;63;55" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <rect x="-5" y="0" width="10" height="45" fill="#3b2a1a"/>
      <path d="M-12 0 H12 L8 -8 H-8 Z" fill="#6b4a1e"/>
      <g transform="translate(0 -8)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 1;0.9 1.15;1.05 0.92;0.95 1.08;1 1" dur="0.8s" repeatCount="indefinite"/>
          <path d="M0 0 C-14 -10 -10 -26 0 -42 C10 -26 14 -10 0 0 Z" fill="#FF6A00"/>
          <path d="M0 0 C-8 -6 -6 -18 0 -28 C6 -18 8 -6 0 0 Z" fill="#FFD23F"/>
        </g>
      </g>
    </g>
    <g transform="translate(820 250)">
      <circle cx="0" cy="-30" r="60" fill="url(#torchGlow)">
        <animate attributeName="r" values="60;54;64;57;60" dur="1.3s" repeatCount="indefinite"/>
      </circle>
      <rect x="-5" y="0" width="10" height="45" fill="#3b2a1a"/>
      <path d="M-12 0 H12 L8 -8 H-8 Z" fill="#6b4a1e"/>
      <g transform="translate(0 -8)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 1;1.05 0.9;0.92 1.12;1.03 0.95;1 1" dur="0.9s" repeatCount="indefinite"/>
          <path d="M0 0 C-14 -10 -10 -26 0 -42 C10 -26 14 -10 0 0 Z" fill="#FF6A00"/>
          <path d="M0 0 C-8 -6 -6 -18 0 -28 C6 -18 8 -6 0 0 Z" fill="#FFD23F"/>
        </g>
      </g>
    </g>

    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.000;1" dur="1.40s" fill="freeze"/>
      <text x="600" y="100" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="bold" letter-spacing="4" fill="url(#gold)" filter="url(#shadow)">ELIEL ELANO CHAVES SILVA</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.400;1" dur="2.00s" fill="freeze"/>
      <line x1="240" y1="138" x2="362" y2="138" stroke="#D4AF37" stroke-width="2"/>
      <polygon points="364,138 370,132 376,138 370,144" fill="#D4AF37"/>
      <line x1="838" y1="138" x2="960" y2="138" stroke="#D4AF37" stroke-width="2"/>
      <polygon points="824,138 830,132 836,138 830,144" fill="#D4AF37"/>
      <text x="600" y="145" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="6" fill="#F5E6C8">CAVALEIRO DO BACKEND</text>
    </g>
  </g>
  <rect x="2" y="2" width="1196" height="336" rx="17" fill="none" stroke="#D4AF37" stroke-opacity="0.6" stroke-width="2"/>
</svg>
