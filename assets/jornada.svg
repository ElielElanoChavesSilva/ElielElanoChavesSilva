<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Jornada do Cavaleiro: Aprendiz 100%, Escudeiro 100%, Cavaleiro 60%, Lorde do Código bloqueado">
  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#8B0000"/>
      <stop offset="0.6" stop-color="#C0392B"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#FFF6CC" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFF6CC" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFF6CC" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="b1"><rect x="560" y="46" width="520" height="18" rx="9"/></clipPath>
    <clipPath id="b2"><rect x="560" y="121" width="520" height="18" rx="9"/></clipPath>
    <clipPath id="b3"><rect x="560" y="196" width="312" height="18" rx="9"/></clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="328" rx="16" fill="#1a1410" stroke="#D4AF37" stroke-width="2"/>

  <g font-family="Georgia, 'Times New Roman', serif">
    <g>
      <circle cx="70" cy="55" r="25" fill="#8B0000" stroke="#D4AF37" stroke-width="3"/>
      <text x="70" y="63" text-anchor="middle" font-size="22" font-weight="bold" fill="#D4AF37">I</text>
      <text x="115" y="50" font-size="22" font-weight="bold" fill="#D4AF37">Aprendiz</text>
      <text x="115" y="74" font-size="15" fill="#F5E6C8">Bacharelado em Tecnologia da Informação</text>
      <rect x="560" y="46" width="520" height="18" rx="9" fill="#2a1d12" stroke="#6b4a1e"/>
      <rect x="560" y="46" width="520" height="18" rx="9" fill="url(#bar)">
        <animate attributeName="width" values="0;0;520" keyTimes="0;0.125;1" dur="1.60s" fill="freeze"/>
      </rect>
      <rect x="460" y="46" width="100" height="18" fill="url(#shine)" clip-path="url(#b1)">
        <animate attributeName="x" values="460;1080;1080" keyTimes="0;0.5;1" begin="1.6s" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="1140" y="61" text-anchor="middle" font-size="17" font-weight="bold" fill="#D4AF37">100%</text>
    </g>

    <g>
      <circle cx="70" cy="130" r="25" fill="#8B0000" stroke="#D4AF37" stroke-width="3"/>
      <text x="70" y="138" text-anchor="middle" font-size="22" font-weight="bold" fill="#D4AF37">II</text>
      <text x="115" y="125" font-size="22" font-weight="bold" fill="#D4AF37">Escudeiro</text>
      <text x="115" y="149" font-size="15" fill="#F5E6C8">Primeiros passos no desenvolvimento de software</text>
      <rect x="560" y="121" width="520" height="18" rx="9" fill="#2a1d12" stroke="#6b4a1e"/>
      <rect x="560" y="121" width="520" height="18" rx="9" fill="url(#bar)">
        <animate attributeName="width" values="0;0;520" keyTimes="0;0.300;1" dur="2.00s" fill="freeze"/>
      </rect>
      <rect x="460" y="121" width="100" height="18" fill="url(#shine)" clip-path="url(#b2)">
        <animate attributeName="x" values="460;1080;1080" keyTimes="0;0.5;1" begin="2.2s" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="1140" y="136" text-anchor="middle" font-size="17" font-weight="bold" fill="#D4AF37">100%</text>
    </g>

    <g>
      <circle cx="70" cy="205" r="25" fill="#8B0000" stroke="#D4AF37" stroke-width="3">
        <animate attributeName="stroke-width" values="3;6;3" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="70" y="213" text-anchor="middle" font-size="22" font-weight="bold" fill="#D4AF37">III</text>
      <text x="115" y="200" font-size="22" font-weight="bold" fill="#D4AF37">Cavaleiro</text>
      <text x="115" y="224" font-size="15" fill="#F5E6C8">Desenvolvedor de Software Backend em atuação</text>
      <rect x="560" y="196" width="520" height="18" rx="9" fill="#2a1d12" stroke="#6b4a1e"/>
      <rect x="560" y="196" width="312" height="18" rx="9" fill="url(#bar)">
        <animate attributeName="width" values="0;0;312" keyTimes="0;0.417;1" dur="2.40s" fill="freeze"/>
      </rect>
      <rect x="460" y="196" width="100" height="18" fill="url(#shine)" clip-path="url(#b3)">
        <animate attributeName="x" values="460;872;872" keyTimes="0;0.5;1" begin="2.6s" dur="3s" repeatCount="indefinite"/>
      </rect>
      <circle cx="872" cy="205" r="7" fill="#FFD23F">
        <animate attributeName="r" values="0;0;7;4;7" keyTimes="0;0.83;0.89;0.95;1" dur="3s" fill="freeze"/>
        <animate attributeName="opacity" values="1;0.4;1" begin="2.4s" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="1140" y="211" text-anchor="middle" font-size="17" font-weight="bold" fill="#D4AF37">60%</text>
    </g>

    <g opacity="0.75">
      <circle cx="70" cy="280" r="25" fill="#2a1d12" stroke="#6b4a1e" stroke-width="3"/>
      <text x="70" y="288" text-anchor="middle" font-size="22" font-weight="bold" fill="#8a7a5a">IV</text>
      <text x="115" y="275" font-size="22" font-weight="bold" fill="#8a7a5a">Lorde do Código</text>
      <text x="115" y="299" font-size="15" fill="#8a7a5a">O próximo capítulo da jornada</text>
      <rect x="560" y="271" width="520" height="18" rx="9" fill="none" stroke="#6b4a1e" stroke-dasharray="8 6"/>
      <g transform="translate(820 280)">
        <animateTransform attributeName="transform" type="translate" values="820 280;817 280;823 280;820 280;820 280" keyTimes="0;0.05;0.1;0.15;1" dur="3s" repeatCount="indefinite"/>
        <path d="M-7 -4 V-9 A7 7 0 0 1 7 -9 V-4" fill="none" stroke="#D4AF37" stroke-width="3"/>
        <rect x="-10" y="-4" width="20" height="15" rx="3" fill="#D4AF37"/>
      </g>
      <text x="1140" y="286" text-anchor="middle" font-size="13" font-weight="bold" letter-spacing="1" fill="#8a7a5a">BLOQUEADO</text>
    </g>
  </g>
</svg>
